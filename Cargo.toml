[package]
name = "orbital-elements"
version = "0.1.0"
edition = "2021"

[dependencies]
three-d = "0.19"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
] }

[profile.release]
opt-level = 3
lto = true
