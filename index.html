<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbital Elements</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        width: 100%;
        height: 100%;
      }
      #canvas {
        display: block;
        outline: none;
        width: 100vw;
        height: 100vh;
      }
      .label {
        position: absolute;
        left: 0;
        top: 0;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        font-size: 14px;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.85);
        transform: translate(-9999px, -9999px);
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="label" id="lbl-z">Z</div>
    <div class="label" id="lbl-y">Y</div>
    <div class="label" id="lbl-x">X</div>
    <div class="label" id="lbl-inclination">Inclination</div>
    <div class="label" id="lbl-perigee">Perigee</div>
    <div class="label" id="lbl-arg-perigee">Argument of Perigee</div>
    <div class="label" id="lbl-raan">RAAN</div>
    <div class="label" id="lbl-desc-node">Descending Node</div>
    <div class="label" id="lbl-asc-node">Ascending Node</div>
    <div class="label" id="lbl-nodes">Line of Nodes</div>
  </body>
</html>
